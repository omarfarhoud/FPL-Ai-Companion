[project]
name = "fpl-ai-companion"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.12.0",
    "cookiecutter>=2.6.0",
    "huggingface-hub<1.0",
    "ipykernel>=6.30.1",
    "ipython>=9.6.0",
    "jupyter>=1.1.1",
    "lime>=0.2.0.1",
    "matplotlib>=3.10.7",
    "missingno>=0.5.2",
    "neo4j>=6.0.3",
    "numpy>=2.1.0",
    "pandas>=2.3.3",
    "plotly>=6.3.1",
    "scikit-learn>=1.7.2",
    "scipy>=1.16.2",
    "seaborn>=0.13.2",
    "torch>=2.0.0,<2.5.0",
    "shap>=0.43.0",
    "python-dotenv>=1.2.1",
    "sentence-transformers>=5.1.2",
    "transformers>=4.57.3",
    "streamlit>=1.52.1",
    "faiss-cpu>=1.13.1",
]
[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
torchaudio = { index = "pytorch" }
